
on:
  workflow_dispatch:
  push:
    branches: main

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libudunits2-dev \
            libproj-dev \
            libgeos-dev \
            libgdal-dev \
            libglu1-mesa \
            freeglut3-dev \
            mesa-common-dev \
            libmagick++-dev \
            gdal-bin

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install casaviz from ZIP
        run: |
          unzip setup/casaviz.zip -d casaviz
          R CMD INSTALL casaviz
          rm -rf casaviz

      - name: Cache renv packages
        uses: actions/cache@v3
        with:
          path: renv/library
          key: ${{ runner.os }}-renv-${{ hashFiles('renv.lock') }}
          restore-keys: |
            ${{ runner.os }}-renv-

      - name: Restore R environment and install GitHub package
        run: Rscript renv-setup.R

      - name: Install missing R packages
        run: |
          Rscript -e 'install.packages("magick")'
          Rscript -e 'install.packages(c("eurostat", "downlit", "xml2", "giscoR", "ggimage", "see", "huxtable"))'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # Ensure reticulate points to Actions Python
      - name: Set RETICULATE_PYTHON environment variables
        run: |
          echo "RETICULATE_PYTHON=${{ env.pythonLocation }}/bin/python" >> $GITHUB_ENV
          echo "RETICULATE_AUTOCONFIGURE=FALSE" >> $GITHUB_ENV

      # Force a clean install of pandas-flavor==0.2.0 and then all deps
      - name: Install Python dependencies (with pandas-flavor pin)
        run: |
          pip install --upgrade pip
          python -c "import sys; print('Using Python:', sys.executable)"
          # Remove any pre-existing pandas_flavor to avoid conflicts
          pip uninstall -y pandas-flavor || true
          # Install the compatible version WITHOUT using cache
          pip install --no-cache-dir 'pandas-flavor==0.2.0'
          # Install your requirements (can be unpinned)
          pip install --no-cache-dir -r requirements.txt
          # Show what is installed
          python -m pip freeze

      # Verify from Python that the decorator exists and where the module lives
      - name: Verify pandas-flavor from Python
        run: |
          python - <<'PY'
          import pandas_flavor, inspect
          print("pandas_flavor version:", getattr(pandas_flavor, "__version__", "unknown"))
          print("has register_groupby_method:", hasattr(pandas_flavor, "register_groupby_method"))
          print("module file:", inspect.getsourcefile(pandas_flavor))
          PY

      # Verify reticulate sees the same Python and pandas_flavor before rendering
      - name: Verify reticulate Python and pandas_flavor from R
        run: |
          Rscript -e 'cat(\"\\n=== reticulate::py_config() ===\\n\"); print(reticulate::py_config())'
          Rscript -e 'reticulate::use_python(Sys.getenv(\"RETICULATE_PYTHON\"), required = TRUE); reticulate::py_run_string(\"import sys; print(\\\"reticulate Python:\\\", sys.executable)\")'
          Rscript -e 'reticulate::py_run_string(\"import pandas_flavor, inspect; print(\\\"pandas_flavor version:\\\", getattr(pandas_flavor, \\\"__version__\\\", \\\"unknown\\\")); print(\\\"has register_groupby_method:\\\", hasattr(pandas_flavor, \\\"register_groupby_method\\\")); print(\\\"module file:\\\", inspect.getsourcefile(pandas_flavor))\")'

      - name: Copy custom SCSS theme to Quarto directory
        run: |
          sudo cp css/casa-slides.scss /opt/quarto/share/formats/revealjs/themes/

      - name: Render Quarto project
        run: quarto render

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
